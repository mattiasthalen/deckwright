# For working on deckwright only: the plugin itself needs none of this. Its script runs
# with `uv run` from its own header and the standard library.
[project]
name = "deckwright-dev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
# The tests were written before this config and are not formatted to it; they change only through the test writer.
exclude = ["tests/**"]
